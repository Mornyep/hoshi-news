name: Starnews Public AI
on:
  workflow_dispatch:
  schedule:
    # UTC: JST 08:13, 12:13, 19:13. GitHub Actions may run late.
    - cron: '13 23,3,10 * * *'
permissions:
  contents: write
concurrency:
  group: public-ai-edition
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AI_PROVIDER: auto
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (no paid API calls)
        run: python -m unittest discover -s tests -v
      - name: Generate sourced public AI edition
        run: python scripts/public_ai.py
      - name: Publish only changed PUBLIC data
        run: |
          if git diff --quiet -- ai-briefs.json; then
            echo 'No new AI edition, public site unchanged.'
            exit 0
          fi
          git config user.name 'starnews-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-briefs.json
          git commit -m 'content: publish sourced public AI digest [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
