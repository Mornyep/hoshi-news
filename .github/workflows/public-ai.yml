name: Starnews Public News AI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/test_multilingual.py'
      - '.github/workflows/public-ai.yml'
  workflow_dispatch:
  schedule:
    # UTC: JST 08:13, 12:13, 19:13. GitHub Actions may run late.
    - cron: '13 23,3,10 * * *'
permissions:
  contents: write
concurrency:
  group: public-ai-edition
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Four translation requests: six main stories + four briefs per locale.
      # At most one shared multilingual acquired-article supplement request.
      # Once-only legacy title backfill can add four requests; no retries.
      # Free/low-cost availability is provider-dependent, not guaranteed.
      # Set true to disable CNA feeds if the site becomes commercial/monetized.
      PUBLIC_SITE_COMMERCIAL: ${{ vars.PUBLIC_SITE_COMMERCIAL || 'false' }}
      AI_PROVIDER: auto
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (no paid API calls)
        run: python -m unittest discover -s tests -v
      - name: Generate sourced public AI edition
        id: generate
        continue-on-error: true
        run: python scripts/publication_status.py
      - name: Publish only changed PUBLIC data
        run: |
          git add ai-briefs.json public-status.json
          if git diff --cached --quiet; then
            echo 'No new AI edition, public site unchanged.'
            exit 0
          fi
          git config user.name 'starnews-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: publish sourced public AI digest [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report failed generation after publishing health
        if: steps.generate.outcome == 'failure'
        run: exit 1
