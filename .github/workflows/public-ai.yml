name: Legacy Public AI Disabled — Source Tests Only
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'backend/**', 'bridge/**', 'personal-*.js', 'jma-events.js', 'provider-setup.js', 'app.js', 'sw.js', '.github/workflows/public-ai.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source tests only — no models or publication
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Personal boundaries and backend isolation — mocked providers only
        run: node --test tests/personal-boundaries.cjs tests/bridge-pairing.mjs backend/tests/private.test.mjs
# Public AI retired by product direction. No schedule, dispatch, provider secrets,
# model calls, data commits, or write permission. Pages deployment is unchanged.
      - name: Install DOM fixture dependency
        run: npm install --prefix "$RUNNER_TEMP/starnews-dom" --no-save --ignore-scripts jsdom@26.1.0
      - name: Session, language and provider isolation — fixture requests only
        env:
          NODE_PATH: ${{ runner.temp }}/starnews-dom/node_modules
        run: |
          node tests/private-session-dom.cjs
          node tests/connection-dom.cjs
          node tests/jma-dom.cjs
          node tests/provider-setup-dom.cjs

      - name: Official loopback bridge security — fixture identities and providers only
        run: |
          npm ci --prefix bridge --ignore-scripts --no-audit --no-fund
          node --test bridge/tests/*.mjs
